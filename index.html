<title>PM Simulator — a PM decision simulator</title>
<style>
/* ============ RESET ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit}
img,svg{display:block}
table{border-collapse:collapse}
/* ============ TOKENS (DESIGN-SPEC §2) ============ */
:root{
  --paper-0:#FBFAF7;--paper-1:#FFFFFF;--paper-2:#F2EFE8;
  --ink-900:#191C1F;--ink-700:#3E444B;--ink-500:#5C636B;
  --line:#E4E0D6;--line-strong:#C8C3B6;
  --brand-050:#FDEEE3;--brand-600:#C2410C;--brand-700:#9A3412;--brand-800:#7C2D12;
  --loss-050:#FBEAE8;--loss-700:#B3261E;--gain-050:#E7F3EA;--gain-700:#166534;
  --clock-050:#FFF3DB;--clock-300:#F2C879;--clock-800:#6E4400;
  --clock-hot-050:#FBE3CB;--clock-hot-800:#7A3306;
  --chatbar:#262B31;--bubble-in:#FFFFFF;--bubble-note:#FFF9DB;--ops-bg:#E8EFE3;
  --sky-a:#D9E6F2;--sky-b:#F6F1E4;--cabin:#EDF0F3;
  --cream:#F7F3EA;--cream-card:#FDFBF5;--debrief-rule:#D8D0BE;
  --bar-fill:#2F343A;--bar-empty:#E7E1D2;
  --focus:#2563EB;--scrim:rgba(25,28,31,0.45);
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --font-data:ui-monospace,"Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --font-serif:Charter,"Bitstream Charter","Noto Serif",Georgia,Cambria,serif;
  --fs-11:0.6875rem;--fs-12:0.75rem;--fs-13:0.8125rem;--fs-14:0.875rem;--fs-15:0.9375rem;
  --fs-16:1rem;--fs-18:1.125rem;--fs-21:1.3125rem;--fs-26:1.625rem;--fs-32:2rem;
  --lh-tight:1.2;--lh-ui:1.45;--lh-body:1.55;--lh-read:1.7;--track-caps:0.08em;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;--sp-12:48px;
  --r-chip:6px;--r-card:12px;--r-sheet:16px;--r-device:28px;--r-pill:999px;
  --shadow-flat:0 1px 0 rgba(25,28,31,0.07);
  --shadow-sun:0 2px 0 rgba(25,28,31,0.10),0 10px 24px -18px rgba(25,28,31,0.45);
  --shadow-overlay:0 8px 40px -8px rgba(25,28,31,0.40);
  --t-fast:120ms;--t-base:200ms;--t-phase:320ms;--t-clock:450ms;--t-exhale:700ms;
  --ease-out:cubic-bezier(0.16,1,0.3,1);--ease-inout:cubic-bezier(0.65,0,0.35,1);
  --tap-min:44px;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper-0);color:var(--ink-900);font-family:var(--font-ui);font-size:var(--fs-15);line-height:var(--lh-ui);transition:background var(--t-exhale)}
body.exhale{background:var(--cream)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:inherit}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ============ SHELL ============ */
.stagewrap{display:block}
main.stage{width:100%;max-width:680px;margin-inline:auto;padding-inline:var(--sp-4)}
.phase-out{opacity:0;transform:translateY(-8px);transition:opacity var(--t-base) var(--ease-inout),transform var(--t-base) var(--ease-inout)}
.phase-in{animation:phasein var(--t-phase) var(--ease-out) both}
@keyframes phasein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.slide-out{opacity:0;transform:translateX(-24px);transition:opacity var(--t-base) var(--ease-inout),transform var(--t-base) var(--ease-inout)}
.slide-in{animation:slidein var(--t-phase) var(--ease-out) both}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.clipx{overflow-x:clip}
.kicker{font-size:var(--fs-11);text-transform:uppercase;letter-spacing:var(--track-caps);color:var(--ink-500);font-weight:600;font-family:var(--font-ui)}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
/* ============ DAY BAR §3.1 ============ */
.daybar{position:sticky;top:0;z-index:40;height:52px;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding-inline:var(--sp-4);background:rgba(251,250,247,0.97);border-bottom:1px solid var(--line-strong);transition:border-color 600ms}
.daybar.dark-edge{border-bottom-color:var(--ink-900)}
.daybar-inner{display:contents}
.logo-btn{display:flex;align-items:center;gap:var(--sp-2);background:none;border:0;cursor:pointer;min-height:44px;min-width:44px;border-radius:var(--r-chip)}
.logo-tile{width:32px;height:32px;border-radius:var(--r-chip);background:var(--brand-600);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:var(--font-ui)}
.wordmark{font-size:var(--fs-14);font-weight:700;color:var(--ink-900)}
.meter{display:flex;flex-direction:column;align-items:center;gap:2px}
.dots{display:flex;align-items:center;gap:var(--sp-2)}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line-strong);flex:none}
.dot.sq{border-radius:2px}
.dot.cur{border-color:var(--ink-900)}
.pipsep{width:1px;height:12px;background:var(--line-strong);margin-inline:var(--sp-2);flex:none}
.dot.on{background:var(--ink-900);border-color:var(--ink-900);animation:dotpop 250ms var(--ease-out)}
@keyframes dotpop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.moves{font-size:var(--fs-11);text-transform:uppercase;letter-spacing:var(--track-caps);color:var(--ink-500)}
.clockchip{display:inline-flex;align-items:center;gap:6px;height:36px;padding-inline:var(--sp-3);border-radius:var(--r-pill);background:var(--clock-050);border:1px solid var(--clock-300);color:var(--clock-800);font-family:var(--font-data);font-size:var(--fs-16);font-weight:600;font-variant-numeric:tabular-nums;transition:background 300ms,color 300ms,border-color 300ms}
.clockchip.hot{background:var(--clock-hot-050);color:var(--clock-hot-800);border-color:rgba(122,51,6,0.4)}
.clockchip.locked{background:var(--ink-900);color:var(--paper-0);border-color:transparent}
.clockchip.washing{animation:wash 600ms}
.clockchip.hot.washing{animation:washhot 600ms}
@keyframes wash{0%{background:var(--clock-050)}50%{background:#FFE9B8}100%{background:var(--clock-050)}}
@keyframes washhot{0%{background:var(--clock-hot-050)}50%{background:#F8D4AE}100%{background:var(--clock-hot-050)}}
.timeslot{position:relative;overflow:hidden;height:1.3em;line-height:1.3}
.timeslot .tstack{display:flex;flex-direction:column;transition:transform var(--t-clock) var(--ease-inout)}
.timeslot .tstack.rolled{transform:translateY(-1.3em)}
.daybar-right{display:flex;align-items:center;gap:var(--sp-2)}
.restart-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-700);flex:none}
.restart-btn:active{background:var(--paper-2)}
@media(hover:hover){.restart-btn:hover{background:var(--paper-2)}}
.restart-btn.corner{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));z-index:41;background:var(--paper-0);border:1px solid var(--line-strong);box-shadow:var(--shadow-flat)}
.hub-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-700);flex:none}
.hub-btn:active{background:var(--paper-2)}
@media(hover:hover){.hub-btn:hover{background:var(--paper-2)}}
.hub-btn.corner{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));z-index:41;background:var(--paper-0);border:1px solid var(--line-strong);box-shadow:var(--shadow-flat)}
/* ============ BUTTONS §3.3 ============ */
.btn-primary{display:inline-flex;align-items:center;justify-content:center;height:48px;border-radius:var(--r-pill);background:var(--brand-700);color:#fff;font-size:var(--fs-16);font-weight:700;padding-inline:var(--sp-6);border:0;cursor:pointer;font-family:var(--font-ui)}
.btn-primary:active:not(:disabled){background:var(--brand-800);transform:translateY(1px)}
.btn-primary:disabled{background:var(--paper-2);color:var(--ink-500);cursor:default;box-shadow:none}
.btn-primary.compact{height:44px}
.btn-primary.full{width:100%}
.btn-primary.ink{background:var(--ink-900)}
.btn-quiet{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border-radius:var(--r-pill);background:transparent;border:1px solid var(--line-strong);color:var(--ink-700);font-size:var(--fs-15);font-weight:600;padding-inline:var(--sp-4);cursor:pointer;font-family:var(--font-ui)}
/* pressed states */
.btn-quiet:active{background:var(--paper-2);transform:translateY(1px)}
.rcard:active{background:var(--paper-2)}
.notif:active{background:var(--paper-2)}
.inboxrow:active{background:var(--paper-2)}
.notestab:active{background:var(--paper-2)}
.sheetclose:active{background:var(--paper-2)}
.logo-btn:active{transform:scale(0.96)}
.btn-quiet.borderless{border:0;font-size:var(--fs-13);color:var(--ink-500);font-weight:600}
@media(hover:hover){
  .btn-primary:hover:not(:disabled){background:var(--brand-600)}
  .btn-primary.ink:hover{background:#2F343A}
  .btn-quiet:hover{background:var(--paper-2)}
  .mcard:hover{border-color:var(--ink-700);box-shadow:var(--shadow-sun)}
  .notif.cta:hover{box-shadow:var(--shadow-sun)}
}
/* ============ HUB — CASE FILES §4 ============ */
.hubwrap{padding-block:var(--sp-8) var(--sp-10)}
.hubhead{margin-bottom:var(--sp-6)}
.hubkicker{font-size:var(--fs-12);font-weight:700;letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--brand-700)}
.hubtitle{font-family:var(--font-serif);font-size:var(--fs-26);color:var(--ink-900);margin-top:var(--sp-1)}
.hubsub{font-size:var(--fs-15);line-height:var(--lh-read);color:var(--ink-700);margin-top:var(--sp-2);max-width:52ch}
.dossier-grid{display:grid;grid-template-columns:1fr;gap:var(--sp-4);margin-top:var(--sp-6)}
@media(min-width:620px){.dossier-grid{grid-template-columns:1fr 1fr}}
.dossier-card{background:var(--paper-1);border:1px solid var(--line-strong);border-radius:var(--r-card);box-shadow:var(--shadow-flat);padding:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-2)}
.dossier-top{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2)}
.dossier-tile{width:32px;height:32px;border-radius:var(--r-chip);background:var(--brand-600);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:var(--font-ui);flex:none}
.dossier-diff{font-size:var(--fs-11);font-weight:700;letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--ink-500)}
.dossier-company{font-family:var(--font-serif);font-size:var(--fs-18);color:var(--ink-900);margin-top:var(--sp-1)}
.dossier-hook{font-size:var(--fs-14);line-height:var(--lh-ui);color:var(--ink-700)}
.dossier-state{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r-chip);padding:2px 8px;font-family:var(--font-data);font-size:var(--fs-13);font-weight:700;align-self:flex-start;margin-top:var(--sp-1)}
.dossier-state.new{background:var(--brand-050);color:var(--brand-700)}
.dossier-state.played{background:var(--gain-050);color:var(--gain-700)}
.dossier-card .dossier-cta{margin-top:var(--sp-3);width:100%}
.dossier-card.locked{background:var(--paper-2);border-style:dashed}
.dossier-num{font-size:var(--fs-11);font-weight:700;letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--ink-500)}
.dossier-lockline{display:flex;align-items:center;gap:6px;font-size:var(--fs-13);color:var(--ink-500);margin-top:var(--sp-2)}
.hubcta{margin-top:var(--sp-10)}
/* ============ INTRO — ORIENTATION §4.0 ============ */
.orientwrap{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:var(--sp-4);background:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 70%)}
.orientcard{width:100%;max-width:420px;background:var(--paper-1);border:1px solid var(--line-strong);border-radius:var(--r-card);box-shadow:var(--shadow-flat);padding:var(--sp-6)}
/* GFR-24: reuses the same hot/urgent palette as .clockchip.hot -- one consistent
   "this is the thing under time pressure" signal across the app, not a new color. */
.orientalarm{display:inline-flex;align-items:center;gap:6px;background:var(--clock-hot-050);color:var(--clock-hot-800);border-radius:var(--r-pill);padding:4px var(--sp-3);font-size:var(--fs-12);font-weight:700;font-family:var(--font-ui)}
.orienthead{font-size:var(--fs-18);font-weight:700;color:var(--ink-900);margin-top:var(--sp-3)}
.orientcard p{font-size:var(--fs-15);line-height:var(--lh-read);margin-top:var(--sp-3)}
.orientcard .btn-primary{margin-top:var(--sp-5);min-height:var(--tap-min)}
.orientsmall{font-size:var(--fs-12);color:var(--ink-500);margin-top:var(--sp-3)}
@media(max-width:479.9px){.orientcard .btn-primary{width:100%}}
/* ============ INTRO — PHONE §4.1 ============ */
.introwrap{min-height:100vh;min-height:100dvh}
.phone{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.speaker{display:none}
@media(min-width:768px){
  .introwrap{display:flex;justify-content:center;align-items:center;padding-block:var(--sp-8)}
  .phone{width:400px;height:min(760px,92vh);min-height:0;border-radius:var(--r-device);border:1px solid var(--line-strong);box-shadow:var(--shadow-sun);position:relative;background:var(--paper-0);transition:width 450ms var(--ease-inout),border-radius 450ms var(--ease-inout),border-color 450ms var(--ease-inout)}
  .phone.dissolve{width:680px;border-radius:var(--r-card);border-color:transparent}
  .speaker{display:block;position:absolute;top:14px;left:50%;transform:translateX(-50%);width:96px;height:4px;border-radius:2px;background:var(--line-strong);z-index:2}
}
@media(max-height:480px){.phone{overflow-y:auto}}
.lock{flex:1;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 70%)}
.statusstrip{display:flex;justify-content:space-between;align-items:center;padding:var(--sp-4);font-size:var(--fs-12);color:var(--ink-500)}
.statusicons{display:flex;gap:6px;align-items:center;color:var(--ink-500)}
.bigclock{text-align:center;margin-top:14%}
.bigclock .t{font-family:var(--font-data);font-size:var(--fs-32);font-weight:300;color:var(--ink-900);font-variant-numeric:tabular-nums;transition:opacity 200ms}
.bigclock .d{font-size:var(--fs-14);color:var(--ink-700);margin-top:var(--sp-1)}
@media(min-width:768px){.bigclock .t{font-size:40px}}
.notifstack{margin-top:auto;display:flex;flex-direction:column;gap:var(--sp-2);padding:var(--sp-4)}
.notif{background:rgba(255,255,255,0.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:var(--r-card);padding:var(--sp-3) var(--sp-4);box-shadow:var(--shadow-flat);min-height:64px;text-align:left;animation:drop 300ms var(--ease-out) both}
@supports not (backdrop-filter:blur(8px)){.notif{background:#F4F2EC}}
@keyframes drop{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes notifglow{0%,100%{box-shadow:var(--shadow-flat)}50%{box-shadow:var(--shadow-sun)}}
.notif .nrow1{display:flex;align-items:center;gap:6px;font-size:var(--fs-12);color:var(--ink-500);margin-bottom:var(--sp-1)}
.notif .nrow1 .src{font-weight:600}
.notif .nrow1 .ntime{font-family:var(--font-data)}
.notif .nbody{font-size:var(--fs-14);line-height:var(--lh-ui);color:var(--ink-900);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.notif.cta{border:0;cursor:pointer;width:100%;position:relative;padding-right:var(--sp-8);animation:drop 300ms var(--ease-out) both,notifglow 2600ms var(--ease-inout) 300ms infinite}
.notif.cta:active{transform:scale(0.98)}
.notif.cta .chev{position:absolute;right:var(--sp-3);top:50%;transform:translateY(-50%);color:var(--ink-500)}
.appicon{width:20px;height:20px;border-radius:5px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.appicon.disc{border-radius:50%}
.hint{align-self:center;margin:0 auto var(--sp-3);opacity:0;transition:opacity 400ms}
.hint.show{opacity:1}
/* ============ INTRO — CHAT §4.2 ============ */
.chatapp{flex:1;display:flex;flex-direction:column;background:var(--paper-0);min-height:0}
.chattop{height:52px;flex:none;background:var(--chatbar);color:#fff;display:flex;align-items:center;justify-content:space-between;padding-inline:var(--sp-4)}
.chattop .ch{display:flex;align-items:center;gap:6px;font-size:var(--fs-15);font-weight:700}
.avcluster{display:flex}
.avcluster span{width:20px;height:20px;border-radius:50%;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-left:-6px;border:1.5px solid var(--chatbar)}
/* GFR-5: bottom-anchor the transcript (real chat apps sit at the bottom of the
   scroll, not the top with a void underneath) -- messages hug the composer while
   they're still arriving, and overflow-y:auto keeps scrolling correct once the
   transcript grows past the viewport. */
.chatbody{flex:1;overflow-y:auto;padding:var(--sp-4);min-height:0;display:flex;flex-direction:column;justify-content:flex-end}
.datediv{display:flex;align-items:center;gap:var(--sp-3);margin-block:var(--sp-3)}
.datediv::before,.datediv::after{content:"";flex:1;height:1px;background:var(--line)}
.datediv span{font-size:var(--fs-11);text-transform:uppercase;letter-spacing:var(--track-caps);color:var(--ink-500)}
.composer{flex:none;padding:var(--sp-3) var(--sp-4) var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3)}
.fakeinput{background:var(--paper-1);border:1px solid var(--line-strong);border-radius:var(--r-card);height:44px;display:flex;align-items:center;padding-inline:var(--sp-4);color:var(--ink-500);font-size:var(--fs-14);cursor:not-allowed;opacity:.7}
/* ============ CHAT GROUP §5.2 ============ */
.group{display:flex;gap:var(--sp-3);margin-block:var(--sp-3)}
.group .gcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--sp-1)}
.avatar{width:36px;height:36px;border-radius:50%;color:#fff;font-size:var(--fs-13);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.avatar.sm{width:32px;height:32px}
.namerow{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap}
.namerow .nm{font-size:var(--fs-14);font-weight:700;color:var(--ink-900);pointer-events:none}
.roletag{font-size:var(--fs-11);text-transform:uppercase;letter-spacing:var(--track-caps);padding:1px 6px;border-radius:var(--r-chip);background:var(--paper-2);color:var(--ink-700);font-weight:600;pointer-events:none}
.namerow .tm{font-size:var(--fs-12);font-family:var(--font-data);color:var(--ink-500);pointer-events:none}
.bubble{background:var(--bubble-in);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--sp-3) var(--sp-4);font-size:var(--fs-15);line-height:var(--lh-body);color:var(--ink-900);max-width:100%;overflow-wrap:break-word}
.gcol .bubble:first-of-type{border-top-left-radius:4px}
.bubble p+p{margin-top:var(--sp-2)}
.bubble.pop{animation:bpop 180ms var(--ease-out) both}

/* ============ SHEETS ============ */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--paper-0);border-radius:var(--r-sheet) var(--r-sheet) 0 0;box-shadow:var(--shadow-overlay);max-height:92vh;max-height:92dvh;display:flex;flex-direction:column}

}
/* ============ ONE-PAGER §4.3 ============ */

.onepager{background:var(--paper-1)}
.ophead{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-6) var(--sp-6) var(--sp-3)}
.ophead .logo-tile{width:40px;height:40px}
.ophead .opname{font-size:var(--fs-21);font-weight:800}
.ophead .optag{font-size:var(--fs-14);font-style:italic;color:var(--ink-500)}
.opbody{padding:0 var(--sp-6) var(--sp-4)}
.opbody dt{font-size:var(--fs-11);text-transform:uppercase;letter-spacing:var(--track-caps);color:var(--brand-700);font-weight:700;margin-top:var(--sp-4)}
.opbody dd{font-size:var(--fs-14);line-height:var(--lh-body);color:var(--ink-700);margin-top:var(--sp-1)}

.opyou{background:var(--brand-050);border-radius:var(--r-card);padding:var(--sp-4);margin-top:var(--sp-4)}
.opyou dt{margin-top:0}
.opfoot{padding:var(--sp-3) var(--sp-6) var(--sp-6);flex:none}
/* ============ DASHBOARD §4.4 ============ */
.card{background:var(--paper-1);border-radius:var(--r-card);border:1px solid var(--line-strong);box-shadow:var(--shadow-flat)}
.dashcard{padding:var(--sp-4) var(--sp-4) var(--sp-2);margin-top:var(--sp-4)}
.dashtitle{font-size:var(--fs-18);font-weight:700;margin-top:2px}
.dashsub{font-size:var(--fs-12);color:var(--ink-500);font-family:var(--font-data);margin-bottom:var(--sp-3)}
.tablewrap{overflow-x:auto;position:relative}
@media(max-width:479.9px){.tablewrap{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-bottom:var(--sp-5)}.tablewrap::after{content:'Scroll for more \2192';position:absolute;right:2px;bottom:0;font-size:var(--fs-11);font-weight:600;letter-spacing:var(--track-caps);color:var(--ink-500);pointer-events:none}}
table.metrics{width:100%}
.metrics th{background:var(--paper-2);font-size:var(--fs-11);text-transform:uppercase;letter-spacing:var(--track-caps);color:var(--ink-500);padding:var(--sp-2) var(--sp-3);text-align:left;font-weight:600;white-space:nowrap}
.metrics th.r,.metrics td.num{text-align:right}
.metrics td{padding:var(--sp-3);border-top:1px solid var(--line);font-size:var(--fs-14);color:var(--ink-700)}

.metrics.mini td{font-size:var(--fs-13);padding:var(--sp-2) var(--sp-3)}

.chip{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r-chip);padding:2px 8px;font-family:var(--font-data);font-size:var(--fs-13);font-weight:700;font-variant-numeric:tabular-nums}
.chip.loss{background:var(--loss-050);color:var(--loss-700)}
.chip.gain{background:var(--gain-050);color:var(--gain-700)}
.chip.flat{background:var(--paper-2);color:var(--ink-700)}
@media(max-width:479.9px){.metrics th{padding:var(--sp-1) var(--sp-2)}.metrics td{padding:var(--sp-2);font-size:var(--fs-13)}.chip{padding:2px 6px}}
.trend{background:var(--paper-2);border-radius:var(--r-chip);padding:var(--sp-3);display:flex;flex-wrap:wrap;gap:var(--sp-4);align-items:center;margin-block:var(--sp-3)}
.tcols{display:flex;gap:var(--sp-4)}
.tcol{font-family:var(--font-data);font-size:var(--fs-13);color:var(--loss-700);font-weight:600}
.tbar{height:4px;background:var(--loss-700);border-radius:2px;margin-top:4px}
.tnote{font-size:var(--fs-13);color:var(--ink-700);font-style:italic}
.inboxsec{margin-top:var(--sp-6)}
.inboxgroup{background:var(--paper-1);border:1px solid var(--line-strong);border-radius:var(--r-card);overflow:hidden;margin-top:var(--sp-2);box-shadow:var(--shadow-flat)}
.inboxrow{display:flex;gap:var(--sp-3);width:100%;text-align:left;padding:var(--sp-3) var(--sp-4);min-height:60px;background:none;border:0;border-top:1px solid var(--line);align-items:center;cursor:pointer}
.inboxrow:first-child{border-top:0}
.inboxrow .mid{flex:1;min-width:0}
.inboxrow .prev{display:block;font-size:var(--fs-13);color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;pointer-events:none}
.inboxrow .right{display:flex;flex-direction:column;align-items:flex-end;gap:var(--sp-1);flex:none}
.inboxrow .tm{font-size:var(--fs-12);font-family:var(--font-data);color:var(--ink-500);pointer-events:none}
.unreaddot{width:8px;height:8px;border-radius:50%;background:var(--brand-600)}
.inboxrow.readrow .nm{font-weight:600;color:var(--ink-700)}
.beginbar{margin-block:var(--sp-6) var(--sp-8)}
/* ============ INVEST §4.5 ============ */
.phasehead{margin-top:var(--sp-6)}
.phasehead h2{font-size:var(--fs-21);font-weight:800;color:var(--ink-900);margin-top:var(--sp-1);line-height:var(--lh-tight)}
.phasehead .sub{font-size:var(--fs-14);color:var(--ink-700);margin-top:var(--sp-2)}
/* GFR-2: live "Moves left" readout, moved out of the 52px day-bar (where it collided
   with .wordmark at 360-412px) and into the phasehead -- unlike the bar's .moves it
   has room, so it stays visible at every width (no <320px hide rule). */
.movesline{font-size:var(--fs-11);text-transform:uppercase;letter-spacing:var(--track-caps);color:var(--ink-500);margin-top:var(--sp-1);display:inline-block}
/* GFR-21: see refreshMeter() -- one-shot pulse whenever the moves-left count changes */
@keyframes meterpulse{0%{transform:scale(1)}35%{transform:scale(1.08);color:var(--brand-700)}100%{transform:scale(1)}}
#movesleft.tick{animation:meterpulse 340ms var(--ease-out)}
.revealregion{margin-top:var(--sp-4)}
.menudivider{text-align:center;font-size:var(--fs-14);color:var(--ink-500);margin-block:var(--sp-5);font-family:var(--font-data)}
/* GFR-10/11: pressure beat / CEO nudge card -- deliberately more visual weight than
   .menudivider (it's meant to register as an interruption, not a timestamp). */
.beat{background:var(--paper-1);border:1px solid var(--line-strong);border-left:3px solid var(--brand-600);border-radius:var(--r-card);padding:var(--sp-3) var(--sp-4);margin-block:var(--sp-4);display:flex;gap:var(--sp-2);align-items:flex-start;animation:cardrise 240ms var(--ease-out) both}
.beat .beaticon{flex:none;color:var(--brand-700);margin-top:3px}
.beat .beatbody{font-size:var(--fs-14);line-height:var(--lh-ui);color:var(--ink-900)}
.beat .beatsrc{font-weight:700}
/* GFR-18: teammate ripple -- a quick aside, deliberately lighter-weight than .beat
   (no card/background) so it reads as a margin comment on the reveal above it. */
.ripple{font-size:var(--fs-13);line-height:var(--lh-ui);color:var(--ink-700);font-style:italic;margin-block:var(--sp-2) 0;padding-left:var(--sp-3);border-left:2px solid var(--line)}
.ripple .ripplename{font-style:normal;font-weight:700}
/* GFR-13: named card clusters -- see buildMenu(). Falls back to a single flat
   .menugrid (today's layout) when no menu item declares .group. */
.mgroup{margin-top:var(--sp-6)}
.mgroup:first-child{margin-top:0}
.mgrouplabel{font-size:var(--fs-11);text-transform:uppercase;letter-spacing:var(--track-caps);color:var(--ink-500);font-weight:600;font-family:var(--font-ui);margin-bottom:var(--sp-2)}
.mgroup .menugrid{margin-block:0}
.menugrid{display:grid;grid-template-columns:1fr;gap:var(--sp-3);margin-block:var(--sp-4) var(--sp-12)}
@media(min-width:768px){.menugrid{grid-template-columns:1fr 1fr}}
/* GFR-12: the working-theory sheet -- reuses the sheet/btn-quiet vocabulary already
   used by the restart confirm sheet, no new visual language. */
.theoryprompt{font-size:var(--fs-15);color:var(--ink-900);line-height:var(--lh-body);margin-bottom:var(--sp-3)}
.theorylist{display:flex;flex-direction:column;gap:var(--sp-2)}
.theorybtn{text-align:left;background:var(--paper-1);border:1px solid var(--line-strong);border-radius:var(--r-card);padding:var(--sp-3) var(--sp-4);font-size:var(--fs-14);line-height:var(--lh-ui);color:var(--ink-900);cursor:pointer;min-height:44px;font-family:var(--font-ui)}
.theorybtn:active{background:var(--paper-2)}
.theoryskip{margin-top:var(--sp-3);width:100%}
.mcard{background:var(--paper-1);border-radius:var(--r-card);border:1px solid var(--line-strong);box-shadow:var(--shadow-flat);padding:var(--sp-4);min-height:88px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:var(--sp-2);transition:border-color var(--t-fast),box-shadow var(--t-fast),opacity 260ms var(--ease-inout),transform 260ms var(--ease-inout)}
.mcard:active{transform:scale(0.985)}
.mcard .mt{font-size:var(--fs-16);font-weight:700;color:var(--ink-900)}
.mcard .ms{font-size:var(--fs-13);line-height:var(--lh-ui);color:var(--ink-500)}
.mcard .price{font-size:var(--fs-12);font-family:var(--font-data);color:var(--clock-800);display:flex;align-items:center;gap:4px;margin-top:auto}
/* GFR-3: source chip -- inline (not absolute) so it never collides with a wrapped
   long title; sits inside the natural flex flow, no layout risk across the grid's
   1-col/2-col breakpoint. */
.mcardtop{display:flex;align-items:flex-start;gap:var(--sp-2)}
.mcard .mchip{flex:none;color:var(--ink-500);opacity:.7;margin-top:3px}
.mcard.expanded{border-color:var(--ink-900)}
.confirmstrip{display:flex;gap:var(--sp-2);margin-top:var(--sp-2);flex-wrap:wrap}
@media(max-width:319.9px){.confirmstrip{flex-direction:column}}
.confirmfoot{padding:0 var(--sp-4) var(--sp-4);flex:none}
.mcard.spending{opacity:0;transform:scale(0.9);max-height:0!important;padding-block:0;margin:0;min-height:0;border-width:0;overflow:hidden}
#menuwrap.mcards-busy .mcard:not(.spending){opacity:.55;cursor:not-allowed;pointer-events:none}
/* ============ REVEAL SKINS §5.6 ============ */
.reveal{margin-block:var(--sp-4)}
.reveal .bubble ol{list-style:decimal;margin:8px 0 2px;padding-left:18px;display:grid;gap:6px}
.reveal.rise{animation:cardrise 240ms var(--ease-out) both}
@keyframes cardrise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dumpcard{background:var(--paper-1);border-radius:var(--r-card);border:1px solid var(--line-strong);overflow:hidden}
.dumphead{background:var(--paper-2);padding:var(--sp-2) var(--sp-4);font-size:var(--fs-12);font-family:var(--font-data);color:var(--ink-700)}
.dumpbody{padding:var(--sp-4)}
/* GFR-23: dump-skin reveals are "the emotional heart of the investigation menu"
   (real complaint/review text) -- style each as its own artifact card, not an
   indented quote inside body copy. Timestamp/handle now reads as a card footer,
   not a citation. */
.ticket{background:var(--paper-0);border:1px solid var(--line-strong);border-radius:var(--r-card);padding:var(--sp-3) var(--sp-4);margin-block:var(--sp-3);font-size:var(--fs-14);line-height:var(--lh-body)}

.opshead{margin-bottom:var(--sp-3)}

.opshead .op{font-size:var(--fs-12);color:var(--ink-500)}
.opsbubble{background:#fff;border-radius:var(--r-card);border-top-left-radius:4px;padding:var(--sp-2) var(--sp-3);margin-block:var(--sp-2);max-width:92%;font-size:var(--fs-14);line-height:var(--lh-body)}
.opsbubble .sender{font-size:var(--fs-13);font-weight:700;display:block}

.mention{background:var(--brand-050);color:var(--brand-700);border-radius:4px;padding:0 3px;font-weight:600}

.filed{display:flex;align-items:center;gap:var(--sp-3);margin-top:var(--sp-3)}
.filed::before{content:"";flex:1;height:1px;background:var(--line)}

.callhead{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-14);font-weight:700}

.callline{font-size:var(--fs-15);line-height:var(--lh-body);margin-block:var(--sp-2)}
.sysline{font-size:var(--fs-12);font-family:var(--font-data);color:var(--ink-500);margin-block:var(--sp-2)}

.notestab{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(48px + env(safe-area-inset-bottom, 0px));padding-bottom:env(safe-area-inset-bottom, 0px);background:var(--paper-1);border-top:1px solid var(--line-strong);box-shadow:0 -2px 0 rgba(25,28,31,0.10);display:flex;align-items:center;justify-content:space-between;padding-inline:var(--sp-4);border-radius:0;cursor:pointer;border-left:0;border-right:0;border-bottom:0;width:100%}

.noterail{display:none}

@media(min-width:1024px){
  .notestab{display:none}
  body.has-notestab .stage{padding-bottom:0}
  .railwrap{display:grid;grid-template-columns:680px 300px;gap:var(--sp-6);justify-content:center;align-items:start}
  .railwrap main.stage{margin-inline:0}

  body{background:var(--paper-0)}

  body.exhale{background-image:none}

/* ============ DECISION §4.6 ============ */
.interstitial{padding-block:var(--sp-10) var(--sp-6);text-align:left}
.heroclock{font-family:var(--font-data);font-size:var(--fs-26);font-weight:700;color:var(--ink-900);font-variant-numeric:tabular-nums}
.plainline{font-size:var(--fs-14);color:var(--ink-700);margin-top:var(--sp-3)}
.radiogrid{display:flex;flex-direction:column;gap:var(--sp-3);margin-block:var(--sp-4) var(--sp-12)}
.rcard{background:var(--paper-1);border-radius:var(--r-card);border:1.5px solid var(--line-strong);padding:var(--sp-4);box-shadow:var(--shadow-flat);min-height:44px;scroll-margin-bottom:96px;cursor:pointer;display:flex;gap:var(--sp-3);text-align:left;transition:border-color var(--t-fast),box-shadow var(--t-fast)}

.rcard[aria-checked="true"] .rdisc::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink-900)}

.rcard .rb{font-size:var(--fs-14);line-height:var(--lh-body);color:var(--ink-700);margin-top:var(--sp-1)}
.stickybar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(251,250,247,0.97);border-top:1px solid var(--line-strong);padding:var(--sp-3) var(--sp-4) calc(var(--sp-3) + env(safe-area-inset-bottom, 0px))}

/* ============ CONSEQUENCE §5.7 ============ */
.consequence{background:var(--paper-1);border-radius:var(--r-card);border:1px solid var(--line-strong);box-shadow:var(--shadow-sun);padding:var(--sp-5);margin-block:var(--sp-4)}

/* GFR-15: tap-to-continue gate between boardroom-consequence beats */
.consequence-continue{margin-top:var(--sp-4);width:100%}
.consequence p{font-size:var(--fs-15);line-height:var(--lh-body);color:var(--ink-700);margin-top:var(--sp-3)}
.consequence p:first-child{margin-top:0}
.consequence .m{font-family:var(--font-data);color:var(--ink-900);font-variant-numeric:tabular-nums}
/* ============ BOARDROOM §4.7 ============ */
.cabinband{background:var(--cabin);margin-inline:calc(-1 * var(--sp-4));padding:var(--sp-8) var(--sp-4)}
.sceneline{font-size:var(--fs-12);font-family:var(--font-data);color:var(--ink-500)}
.narr{font-size:var(--fs-15);color:var(--ink-700);margin-top:var(--sp-4)}
.pullquote{font-size:var(--fs-18);line-height:var(--lh-body);color:var(--ink-900);border-left:3px solid var(--ink-900);padding-left:var(--sp-4);margin-top:var(--sp-4)}
@media(min-width:768px){.pullquote{font-size:var(--fs-21)}}
.pqby{font-size:var(--fs-12);color:var(--ink-500);margin-top:var(--sp-2)}
/* ============ DEBRIEF §4.8 ============ */
.debrief{max-width:600px;margin-inline:auto;font-family:var(--font-serif);font-size:var(--fs-16);line-height:var(--lh-read);color:var(--ink-900);padding-block:var(--sp-10)}
@media(min-width:768px){.debrief{font-size:var(--fs-18)}}
.debrief.still{animation:stillin 700ms ease both}
@keyframes stillin{from{opacity:0}to{opacity:1}}
.debrief p{margin-top:var(--sp-4)}
.debrief .kicker{font-family:var(--font-ui)}
.dframe{border-bottom:1px solid var(--debrief-rule);padding-bottom:var(--sp-6)}
.dframe .dlead{font-weight:700;margin-top:var(--sp-3)}
.dsec{margin-top:var(--sp-8)}
.debrief .num{font-family:var(--font-data);font-size:var(--fs-15);color:var(--ink-900);font-weight:700}
.closer{font-size:var(--fs-18);font-weight:700}
.scoreline{margin-top:var(--sp-3);font-family:var(--font-data);font-variant-numeric:tabular-nums;line-height:1}
/* GFR-9: the score is the payoff of ~7 minutes of pressure -- typographically it read
   like a form field. Scale it past the existing --fs-32 ceiling; the "/20" stays small
   and quiet by contrast. The count-up animation and the beat before the band title
   resolves are untouched -- both already load-bearing per the prior UI audit. */
.scorenum{font-size:clamp(2.75rem,13vw,3.75rem);font-weight:800;color:var(--ink-900);letter-spacing:-0.01em}
.scoreden{font-size:var(--fs-14);font-weight:600;color:var(--ink-500);margin-left:4px}
.bandtitle{font-family:var(--font-serif);font-size:var(--fs-26);font-weight:700;color:var(--ink-900);margin-top:var(--sp-3);line-height:var(--lh-tight);transition:opacity var(--t-phase) var(--ease-out),transform var(--t-phase) var(--ease-out)}
@media(min-width:768px){.bandtitle{font-size:var(--fs-32)}}
/* GFR-1: the fixed .hub-btn.corner (top:56 left:8, 44px) can sit directly over this
   line's first glyph at natural mobile/tablet scroll rest points -- verified via
   elementFromPoint sweep. Clear it with left padding rather than moving the button,
   which would need a scroll listener for what should be an Effort-S fix. */
@media(max-width:799.9px){.bandtitle{padding-left:44px}}
.dinkus{width:48px;height:3px;background:var(--brand-600);margin-block:var(--sp-3) var(--sp-5);transition:width var(--t-phase) var(--ease-out)}
.bandtext,#bandsec .sharecard{transition:opacity var(--t-base) var(--ease-out) 200ms}
/* GFR-8: honest, computed near-miss line for non-A bands (band boundaries themselves
   are untouched, so fixtures stay green) -- real point-gap to the next band, not a
   fabricated "so close" claim, so it stays true even on a floor score. */
.bandgap{font-style:italic;color:var(--ink-500);font-size:var(--fs-13);margin-top:var(--sp-1);transition:opacity var(--t-base) var(--ease-out) 200ms}
.prereveal .bandtitle{opacity:0;transform:scale(0.96)}
.prereveal .dinkus{width:0}
.prereveal .bandtext,.prereveal .sharecard,.prereveal .bandgap{opacity:0}
.pathblock{border-left:2px solid var(--debrief-rule);padding-left:var(--sp-4);margin-top:var(--sp-4)}
/* GFR-16: native disclosure, no new JS -- matches the project's "no build
   tooling" constraint. Chevron reuses the existing SVG.chevR (same rotate-on-open
   idiom as .notestab's chevU). */
.breakdown{margin-top:var(--sp-8);border-top:1px solid var(--debrief-rule)}
.breakdown summary{cursor:pointer;list-style:none;font-family:var(--font-ui);font-size:var(--fs-14);font-weight:700;color:var(--brand-700);padding-block:var(--sp-4);display:flex;align-items:center;justify-content:space-between;min-height:var(--tap-min)}
.breakdown summary::-webkit-details-marker{display:none}
.breakdown .bkchev{transition:transform 200ms var(--ease-out)}
.breakdown[open] .bkchev{transform:rotate(90deg)}
/* GFR-6: counterfactual teaser -- reuses .reveal/.dsec spacing so the "road not taken"
   card reads as a real reveal, not a new visual language. */
.cfintro{font-size:var(--fs-15);color:var(--ink-700);margin-top:var(--sp-2)}
.cfclose{font-size:var(--fs-13);color:var(--ink-500);font-style:italic;margin-top:var(--sp-2)}
.runin{font-family:var(--font-ui);font-size:var(--fs-13);font-weight:700;color:var(--ink-900)}
.dline{margin-top:var(--sp-6)}
.integrity{background:var(--bubble-note);border-radius:var(--r-card);padding:var(--sp-4);border-left:3px solid var(--clock-800);font-style:italic;margin-top:var(--sp-6)}
.dimswrap{margin-block:var(--sp-8)}
.dimrow{display:grid;grid-template-columns:45% 1fr auto;align-items:center;min-height:44px;gap:var(--sp-3)}
@media(max-width:399px){.dimrow{grid-template-columns:1fr auto;grid-template-areas:"lbl lbl" "trk val"}.dimrow .dlbl{grid-area:lbl}.dimrow .segs{grid-area:trk}.dimrow .dval{grid-area:val}}
.dimrow .dlbl{font-family:var(--font-ui);font-size:var(--fs-13);font-weight:600;color:var(--ink-700)}
.segs{display:flex;gap:var(--sp-1)}
.seg{height:10px;border-radius:5px;flex:1;background:var(--bar-empty)}
.seg.fill{background:var(--bar-fill);opacity:0;transition:opacity 200ms}
.seg.fill.lit{opacity:1}
.dimrow .dval{font-size:var(--fs-12);font-family:var(--font-data);color:var(--ink-500);opacity:0;transition:opacity 300ms}
.dimrow .dval.lit{opacity:1}
.dimnote{font-style:italic;color:var(--ink-700);font-size:var(--fs-14)}
/* ============ CTA §4.9 ============ */
.ctacard{background:var(--cream-card);border:1px solid var(--debrief-rule);border-radius:var(--r-card);box-shadow:var(--shadow-flat);padding:var(--sp-6);margin-block:var(--sp-10)}
.ctacard h2{font-family:var(--font-serif);font-size:var(--fs-21);font-weight:700;color:var(--ink-900);line-height:var(--lh-tight)}
@media(min-width:768px){.ctacard h2{font-size:var(--fs-26)}}
.ctacard .cbody{font-family:var(--font-serif);font-size:var(--fs-15);line-height:var(--lh-read);color:var(--ink-700);margin-top:var(--sp-3)}
.ctaform{display:flex;flex-direction:column;gap:var(--sp-3);margin-top:var(--sp-5)}
@media(min-width:480px){.ctaform{flex-direction:row}.ctaform input{flex:1}}
.ctaform input{height:48px;background:#fff;border:1.5px solid var(--line-strong);border-radius:var(--r-pill);padding-inline:var(--sp-4);font-size:var(--fs-16);font-family:var(--font-ui);color:var(--ink-900);min-width:0}
.ctaform input::placeholder{color:var(--ink-500)}
.ctamicro{font-size:var(--fs-12);font-family:var(--font-ui);color:var(--ink-500);margin-top:var(--sp-2)}
.ctaerr{font-size:var(--fs-13);font-family:var(--font-ui);color:var(--loss-700);margin-top:var(--sp-2)}
.ctasuccess{font-family:var(--font-serif);font-size:var(--fs-15);color:var(--gain-700);margin-top:var(--sp-5)}
.sitefooter{font-size:var(--fs-12);font-family:var(--font-ui);color:var(--ink-500);text-align:center;padding-block:var(--sp-6) var(--sp-10);line-height:2}
/* ============ SHARE ============ */
.sharecard{background:var(--cream-card);border:1px solid var(--debrief-rule);border-radius:var(--r-card);box-shadow:var(--shadow-flat);padding:var(--sp-5) var(--sp-6);margin-top:var(--sp-6)}
.sharecard .sharelead{font-family:var(--font-serif);font-size:var(--fs-15);line-height:var(--lh-read);color:var(--ink-700)}
.sharerow{display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp-3);margin-top:var(--sp-4)}
.shareconfirm{font-family:var(--font-ui);font-size:var(--fs-13);font-weight:600;color:var(--brand-700)}
.shareconfirm[hidden]{display:none}
@media(max-width:479.9px){.sharecard .btn-primary{width:100%}}
.orientshare{display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp-3);margin-top:var(--sp-4)}
.orientshare .btn-quiet{font-size:var(--fs-13);min-height:var(--tap-min);padding-inline:var(--sp-4);color:var(--brand-700);border-color:var(--line-strong)}
/* ============ 320px floor ============ */
@media(max-width:359.9px){.wordmark{display:none}.daybar{gap:4px;padding-inline:var(--sp-2)}.daybar-right{gap:2px}.daybar-right .hub-btn,.daybar-right .restart-btn{width:36px;height:36px}.clockchip{padding-inline:4px}.clockchip #clockglyph{display:none}}
@media(max-width:319.9px){.moves{display:none}}
/* ============ REDUCED MOTION §6 ============ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
  .typing{display:none!important}
  .phase-in,.phase-out,.slide-in,.slide-out{transform:none!important}
  .notif,.bubble.pop,.reveal.rise,.beat{animation:none!important;opacity:1;transform:none}
  .seg.fill{opacity:1!important}
  .dimrow .dval{opacity:1!important}
}
</style>

<h1 class="vh" id="sch1"></h1>
<div id="chrome"></div>
<div id="layout" class="stagewrap"><main class="stage" id="stage"></main></div>
<div id="overlay"></div>
<script src="s01.js"></script>
<script src="s02.js"></script>

<script>
'use strict';
/* Set after Apps Script deploy — see WAITLIST-SETUP.md */
const WAITLIST_URL = "https://script.google.com/macros/s/AKfycbxYTKpBvFV-r365Ccfgu9eBJi4_lteF51H29nX31D9VXSNpVmUxZZQ19JtXxVKA8d0aFw/exec";

/*SCORE-START*/
function computeScore(picks, decision, framing){
  var pickScore = 0;
  for (var i=0;i<picks.length;i++) pickScore += SC().pts[picks[i]];
  var infIds = SC().decision.informedIds;
  var threshold = SC().decision.informedThreshold || 1;
  var hits = 0;
  for (var j=0;j<infIds.length;j++) if (picks.indexOf(infIds[j])>=0) hits++;
  var informed = hits >= threshold;
  var dp = SC().decision.pts[decision];
  var decisionScore = (dp && typeof dp === 'object') ? (informed ? dp.informed : dp.default) : dp;
  var fm = SC().framing.mod[framing];
  var framingMod = (fm && typeof fm === 'object') ? (informed ? fm.informed : fm.default) : fm;
  var total = Math.max(0, pickScore + decisionScore + framingMod);
  var band = total >= 15 ? 'A' : (total >= 8 ? 'B' : 'C');
  return {pickScore:pickScore, decisionScore:decisionScore, framingMod:framingMod, total:total, band:band, informed:informed};
}
function computeDims(picks, decision, framing){
  var sc = computeScore(picks, decision, framing);
  return SC().dims(picks, decision, framing, sc);
}
function sharpIds(){
  var pts = SC().pts, ids = [];
  for (var k in pts) if (pts.hasOwnProperty(k) && pts[k] === 3) ids.push(k);
  return ids;
}
/* GFR-6: the first decision.informedIds entry the player did NOT pick -- the debrief's
   "move you didn't make" teaser. Reads the same field computeScore() already uses for
   the informed/blind decision variant, so this is presentation over existing schema,
   zero new data. Returns null when the player picked every informed id (guarded in
   renderDebrief with a congratulatory line instead, per the review's own risk note). */
function counterfactualId(){
  var infIds = SC().decision.informedIds || [];
  for (var i=0;i<infIds.length;i++) if (S.picks.indexOf(infIds[i]) < 0) return infIds[i];
  return null;
}
/*SCORE-END*/

/* ---------- helpers ---------- */
var RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
var hadTap = false;
addEventListener('pointerdown', function(){ hadTap = true; }, { once: true, passive: true });
function buzz(p){ if (RM || !hadTap) return; try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }
function $(s,r){ return (r||document).querySelector(s); }
function h(html){ var t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function esc(s){ return s; } /* copy is authored constants */
var SVG = {
  clock:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.5V8l2.5 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  clockSm:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.5V8l2.5 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  lock:'<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M8 4.5V8l2.5 1.5" stroke="#191C1F" stroke-width="1.5" stroke-linecap="round"/></svg>',
  up:'<svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><path d="M4 1 7.5 7H.5Z" fill="currentColor"/></svg>',
  down:'<svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><path d="M4 7 .5 1h7Z" fill="currentColor"/></svg>',
  chevR:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m6 3 5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  chevU:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m3 10 5-5 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  x:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  phone:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 2.5c0 6 4.5 10.5 10.5 10.5l1-2.5-3-1.5-1.5 1.5C8 9.5 6.5 8 5.5 6l1.5-1.5L5.5 1.5 3 2.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>',
  status:'<svg width="40" height="12" viewBox="0 0 40 12" fill="currentColor" aria-hidden="true"><rect x="0" y="7" width="2" height="4" rx="1"/><rect x="3.5" y="5" width="2" height="6" rx="1"/><rect x="7" y="3" width="2" height="8" rx="1"/><path d="M14 8a5.5 5.5 0 0 1 8 0l-1.4 1.4a3.5 3.5 0 0 0-5.2 0Z"/><circle cx="18" cy="10.6" r="1.2"/><rect x="26" y="3.5" width="11" height="6" rx="1.6" fill="none" stroke="currentColor"/><rect x="27.5" y="5" width="6" height="3" rx="0.8"/><rect x="37.6" y="5.4" width="1.6" height="2.4" rx="0.8"/></svg>',
  restart:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M12.5 8A4.5 4.5 0 1 1 10.8 4.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M10.3 2.2 10.9 5.1 8 5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  grid:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="9" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="2" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="9" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.6"/></svg>',
  /* GFR-3: source-chip glyphs, one per menu-item .skin -- see SKIN_META below. */
  skinChat:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 3.5h12v7H6.5L3 13v-2.5H2v-7Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>',
  skinDump:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2.5" y="2" width="11" height="12" rx="1" stroke="currentColor" stroke-width="1.4"/><path d="M5 5.5h6M5 8h6M5 10.5h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
  skinOps:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="5.5" cy="5.5" r="2" stroke="currentColor" stroke-width="1.3"/><circle cx="11" cy="6.5" r="1.6" stroke="currentColor" stroke-width="1.3"/><path d="M2 13c0-2.2 1.6-3.5 3.5-3.5S9 10.8 9 13M9.3 13c0-1.7 1.2-2.7 2.7-2.7s2.7 1 2.7 2.7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
  /* GFR-10/11: pressure-beat glyph (the room moving while you deliberate, incl. the
     CEO's own nudge -- same mechanism, see beatHTML()). */
  bell:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2.6c-2 0-3.2 1.6-3.2 4v2.1L3.4 11h9.2l-1.4-2.3V6.6c0-2.4-1.2-4-3.2-4Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M6.5 12.4a1.5 1.5 0 0 0 3 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>'
};
/* GFR-3: menu.byId[id].skin already drives each reveal's presentation -- surface the
   same value on the collapsed card as a small glyph so the 12-card menu reads as a
   textured set of leads (a message, a data pull, a call, a group ping) instead of
   12 identical rectangles. Engine-generic: reads m.skin, no-op for an unknown/absent
   skin. Zero new schema. */
var SKIN_META = {
  chat: { glyph: 'skinChat', label: 'Message' },
  dump: { glyph: 'skinDump', label: 'Data pull' },
  call: { glyph: 'phone', label: 'Call' },
  ops: { glyph: 'skinOps', label: 'Group ping' }
};
function skinChipHTML(skin){
  var meta = SKIN_META[skin];
  if (!meta) return '';
  return '<span class="mchip" aria-hidden="true">'+SVG[meta.glyph]+'</span><span class="vh">'+meta.label+'.</span>';
}
function chip(kind, glyph, text, sr){
  return '<span class="chip '+kind+'">'+(glyph?SVG[glyph]:'')+'<span>'+text+'</span>'+(sr?'<span class="vh"> '+sr+'</span>':'')+'</span>';
}
/* ---------- state ---------- */
var SCENARIO_ID = 's01'; /* set by hub/boot before renderPhase(); default s01 for direct deep-link */
function SC(){ return window.PMSIM && window.PMSIM.scenarios[SCENARIO_ID]; }
function skeyFor(id){ return 'pmsim-' + id; }
var SKEY = skeyFor(SCENARIO_ID);
var SLATE = [
  {id:'s01', difficulty:'First week'},
  {id:'s02', difficulty:'First week'},
  {id:'s03', difficulty:'Trial by fire'},
  {id:'s04', difficulty:'Trial by fire'},
  {id:'s05', difficulty:'The deep end'}
];
var S;
function defState(){ return {phase:'intro', sub:'orient', picks:[], decision:null, framing:null, read:[SC().ceoKey], saw1p:false, joined:false, debriefed:false, theory:null, theoryAsked:false}; }
function load(){
  try{ var raw = localStorage.getItem(SKEY); if(!raw) return null;
    var s = JSON.parse(raw);
    if (!s || typeof s.phase !== 'string' || !Array.isArray(s.picks)) return null;
    return s;
  }catch(e){ return null; }
}
function save(){ try{ localStorage.setItem(SKEY, JSON.stringify(S)); }catch(e){} }
function resetState(){ try{ localStorage.removeItem(SKEY); }catch(e){} S = defState(); }
/* ---------- progress (cross-scenario, survives resetState) + anonymous analytics ---------- */
var PKEY = 'pmsim-progress';
/* Set after Apps Script deploy — see ANALYTICS-SETUP.md. Empty = no-op, no console error. */
var ANALYTICS_URL = "";
function loadProgress(){
  try{
    var raw = localStorage.getItem(PKEY);
    var p = raw ? JSON.parse(raw) : null;
    if (!p || typeof p !== 'object' || typeof p.cases !== 'object' || !p.cases) return {v:1, cases:{}, joined:false};
    return {v:1, cases:p.cases, joined:!!p.joined};
  }catch(e){ return {v:1, cases:{}, joined:false}; }
}
function saveProgress(p){ try{ localStorage.setItem(PKEY, JSON.stringify(p)); }catch(e){} }
function markJoined(){
  var p = loadProgress();
  if (p.joined) return;
  p.joined = true;
  saveProgress(p);
}
/* records one completed play (best-of), fires the anonymous analytics beacon, returns the updated case entry */
function recordCompletion(scenarioId, sc, dims){
  var p = loadProgress();
  var prev = p.cases[scenarioId];
  var isNewBest = !prev || sc.total > prev.best;
  p.cases[scenarioId] = {
    best: isNewBest ? sc.total : prev.best,
    band: isNewBest ? sc.band : prev.band,
    plays: (prev ? prev.plays : 0) + 1,
    last: { score: sc.total, band: sc.band, ts: new Date().toISOString() }
  };
  saveProgress(p);
  if (ANALYTICS_URL){
    fetch(ANALYTICS_URL, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ scenario: scenarioId, score: sc.total, band: sc.band, dims: dims, ts: new Date().toISOString() })
    })['catch'](function(){});
  }
  return p.cases[scenarioId];
}
/* ---------- fiction constants ---------- */
function clockNow(){
  if (S.phase==='boardroom') return (SC().clock&&SC().clock.boardroomTime)||SC().times[4];
  if (S.phase==='decision' || S.picks.length>=4) return SC().times[4];
  return SC().times[S.picks.length];
}
function avatar(p, sm){ return '<span class="avatar'+(sm?' sm':'')+'" style="background:'+p.c+'" aria-hidden="true">'+p.a+'</span>'; }
function groupHTML(p, time, bubbles, opts){
  opts = opts || {};
  var name = opts.fullName ? p.full : p.n;
  var bs = '';
  for (var i=0;i<bubbles.length;i++) bs += '<div class="bubble'+(opts.pop?' pop':'')+'"'+(opts.pop?' style="animation-delay:'+(i*90)+'ms"':'')+'>'+bubbles[i]+'</div>';
  return '<div class="group">'+avatar(p)+'<div class="gcol"><div class="namerow"><span class="nm">'+name+'</span><span class="roletag">'+p.r+'</span><span class="tm">'+time+'</span></div>'+bs+'</div></div>';
}
/* GFR-4: walks the bubble array -- indicator, message, indicator, message -- instead
   of one flat 900ms indicator then dumping every bubble at once. The pause before
   each message scales with THAT message's length, so the long board-call paragraph
   visibly takes longer to "arrive" than "Seen the dashboard?". RM branch unchanged:
   still dumps the whole group instantly via the original groupHTML(). */
function ceoTypingDelay(text){
  var plain = String(text).replace(/<[^>]+>/g,'');
  return Math.max(500, Math.min(1600, 380 + plain.length*9));
}
function typeIn(container, person, time, bubbles, done){
  if (RM){ container.insertAdjacentHTML('beforeend', groupHTML(person, time, bubbles)); if (done) done(); return; }
  var group = h('<div class="group">'+avatar(person)+'<div class="gcol"><div class="namerow"><span class="nm">'+person.n+'</span><span class="roletag">'+person.r+'</span><span class="tm">'+time+'</span></div></div></div>');
  container.appendChild(group);
  var gcol = group.querySelector('.gcol');
  var i = 0;
  function step(){
    if (i >= bubbles.length){ if (done) done(); return; }
    var msg = bubbles[i];
    var t = h('<div class="typing" aria-hidden="true"><i></i><i></i><i></i></div>');
    gcol.appendChild(t);
    container.scrollTop = container.scrollHeight;
    setTimeout(function(){
      t.remove();
      var b = h('<div class="bubble pop">'+msg+'</div>');
      gcol.appendChild(b);
      container.scrollTop = container.scrollHeight;
      i++;
      setTimeout(step, 240);
    }, ceoTypingDelay(msg));
  }
  step();
}
/* GFR-19: multi-voice cold open -- chains multiple typeIn() turns (each its own
   person/time/bubbles) so teammates can post before the CEO instead of the CEO
   being the only voice in the channel. A single-turn call behaves exactly like a
   direct typeIn() call, so this is a strict superset, not a replacement. */
function typeInSequence(container, turns, done){
  var i = 0;
  function next(){
    if (i >= turns.length){ if (done) done(); return; }
    var t = turns[i]; i++;
    typeIn(container, t.person, t.time, t.bubbles, next);
  }
  next();
}

var sheetState = null;
function openSheet(opts){
  closeSheet(true);
  var ov = $('#overlay');
  var scrim = h('<div class="scrim"></div>');
  var sheet = h('<div class="sheet '+(opts.cls||'')+'" role="dialog" aria-modal="true" aria-label="'+opts.label+'"></div>');
  if (opts.brandband) sheet.appendChild(h('<div class="brandband"></div>'));
  if (!opts.noHandle) sheet.appendChild(h('<div class="sheethandle" aria-hidden="true"></div>'));
  if (opts.titleRow){
    var tr = h('<div class="sheettitle"><span class="st">'+opts.titleRow+'</span></div>');
    var cb = h('<button class="sheetclose" aria-label="Close">'+SVG.x+'</button>');
    cb.addEventListener('click', function(){ closeSheet(); });
    tr.appendChild(cb); sheet.appendChild(tr);
  }
  var body = h('<div class="sheetbody"></div>');
  body.appendChild(opts.content);
  sheet.appendChild(body);
  if (opts.footer) sheet.appendChild(opts.footer);
  ov.appendChild(scrim); ov.appendChild(sheet);
  var returnTo = document.activeElement;
  function onKey(e){
    if (e.key==='Escape' && opts.dismissable !== false){ e.preventDefault(); closeSheet(); }
    if (e.key==='Tab'){
      var f = sheet.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])');
      if (!f.length) return;
      var first=f[0], last=f[f.length-1];
      if (e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
    }
  }
  document.addEventListener('keydown', onKey);
  if (opts.dismissable !== false) scrim.addEventListener('click', function(){ closeSheet(); });
  sheetState = {scrim:scrim, sheet:sheet, onKey:onKey, returnTo:returnTo, onClose:opts.onClose};
  /* Auto-focus target must be safe: the titleRow close button (unchanged
     behavior) or an explicit text input. Sheets with neither (e.g. the
     one-pager, which only has a footer CTA) must NOT auto-focus an
     actionable button — doing so raced the sheet's mount/scroll on real
     devices and could leave the CTA's first tap silently swallowed. Focus
     the sheet container itself instead: it's still a valid a11y focus
     target (role=dialog) without triggering any action. */
  if (opts.titleRow){
    var focusable = sheet.querySelector('.sheetclose');
    if (focusable) focusable.focus();
  } else {
    var typeInput = sheet.querySelector('input');
    if (typeInput) typeInput.focus();
    else { sheet.setAttribute('tabindex','-1'); sheet.focus(); }
  }
}
function closeSheet(silent){
  if (!sheetState) return;
  var st = sheetState; sheetState = null;
  document.removeEventListener('keydown', st.onKey);
  st.scrim.remove(); st.sheet.remove();
  if (!silent){
    if (st.onClose) st.onClose();
    if (st.returnTo && st.returnTo.focus && document.contains(st.returnTo)) st.returnTo.focus();
  }
}

  var t = clockNow();

    var lv = $('#clocklive');

    var isHot = t===SC().times[3], isLocked = t===SC().times[4] || S.phase==='boardroom';

      var db = $('#daybar'); if (db){ db.classList.add('dark-edge'); setTimeout(function(){ db.classList.remove('dark-edge'); }, 600); }

  setTimeout(function(){

/* GFR-20: "the dashboard is where the player first feels 'this is bad', and it
   should have the same care the score count-up already gets." Generic -- parses
   sign/number/suffix out of whatever string is already in the cell (no schema
   change, works for any scenario's dashRows) and counts up to it; anything that
   doesn't look like a plain number (leaves the cell untouched, e.g. em-dashes) is a
   safe no-op. */
function animateNumberCell(el, delay){
  var raw = el.textContent;
  var m = /^([₹$]?)([−\-+]?)([\d,]+)(.*)$/.exec(raw);
  if (!m) return;
  var prefix = m[1];
  var sign = m[2];
  var target = parseInt(m[3].replace(/,/g,''), 10);
  var hasComma = m[3].indexOf(',') >= 0;
  var suffix = m[4];
  if (isNaN(target)) return;
  setTimeout(function(){
    var t0 = null;
    function tick(ts){
      if (t0 === null) t0 = ts;
      var p = Math.min(1, (ts - t0) / 650);
      var e = 1 - Math.pow(1 - p, 3);
      var cur = Math.round(target * e);
      var curStr = hasComma ? String(cur).replace(/\B(?=(\d{3})+(?!\d))/g, ',') : String(cur);
      el.textContent = prefix + sign + curStr + suffix;
      if (p < 1) requestAnimationFrame(tick); else el.textContent = raw;
    }
    requestAnimationFrame(tick);
  }, delay);
}

      document.body.removeChild(ta);
    }catch(e){}
    showShareConfirm(confirmEl);
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ showShareConfirm(confirmEl); })['catch'](legacy);
  } else legacy();
}
function wireShare(btnId, confirmId, kind){
  var btn = $('#'+btnId);
  if (!btn) return;
  btn.addEventListener('click', function(){
    var text = shareText(kind);
    if (navigator.share){
      navigator.share({text: text})['catch'](function(){});
    } else {
      copyShareText(text, $('#'+confirmId));
    }
  });
}
/* ---------- phase router ---------- */
function renderPhase(){
  closeSheet(true);
  document.body.classList.toggle('exhale', S.phase==='debrief' || S.phase==='cta');
  document.body.classList.remove('has-stickybar');
  var old = $('#stickybar'); if (old) old.remove();
  if (S.phase==='intro') renderIntro();
  else if (S.phase==='invest') renderInvest();
  else if (S.phase==='decision') renderDecision();
  else if (S.phase==='boardroom') renderBoardroom();
  else renderDebrief();
  window.scrollTo(0,0);
}
/* ---------- boot ---------- */
S = load() || defState();
var _bootCases = loadProgress().cases, _bootHasProgress = false;
for (var _bk in _bootCases){ if (_bootCases.hasOwnProperty(_bk)){ _bootHasProgress = true; break; } }
if (_bootHasProgress){
  goHub();
} else {
  document.getElementById('sch1').textContent = SC().title;
  renderPhase();
}
